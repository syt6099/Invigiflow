<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invigiflow – Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="app">
        <div class="flex-between mb-4">
            <div>
                <h1>Dashboard</h1>
                <span class="text-muted" id="welcome-msg">Welcome back, Admin</span>
            </div>
            <div class="flex gap-2">
                <a href="database.html" class="btn btn-outline btn-sm"><i class="fas fa-database"></i> Database</a>
                <button class="btn btn-primary btn-sm" onclick="startNewExamWeek()"><i class="fas fa-plus"></i> New Exam Week</button>
                <button class="btn btn-outline btn-sm" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>Exam Week Records</h3>
                <span class="text-sm text-muted" id="exam-count">0 records</span>
            </div>
            <div id="exam-week-list" class="exam-list">
                <div class="empty-state">No exam weeks created yet.</div>
            </div>
        </div>

        <div class="dash-grid mt-4">
            <div class="card">
                <h3>Quick Actions</h3>
                <div class="flex gap-2 mt-3 flex-wrap">
                    <button class="btn btn-primary btn-sm" onclick="startNewExamWeek()"><i class="fas fa-calendar-plus"></i> New Exam Week</button>
                    <a href="database.html" class="btn btn-outline btn-sm"><i class="fas fa-users"></i> Manage Teachers</a>
                </div>
            </div>
        </div>
        <div id="toast" class="toast"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
