<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="login-box">
            <h1>Create Account</h1>
            <p class="sub">Sign up for Invigiflow</p>
            <form id="signup-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="signup-username" placeholder="Your display name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signup-email" required>
                </div>
                <div class="form-group">
                    <label>Verification Code</label>
                    <div style="display:flex; gap:8px;">
                        <input type="text" id="signup-code" placeholder="6-digit code" required style="flex:1;">
                        <button type="button" id="send-code-btn" class="btn btn-outline btn-sm">Send Code</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="signup-confirm" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
                <div class="links" style="justify-content:center; margin-top:12px;">
                    <a href="login.html">Already have an account? Log in</a>
                </div>
            </form>
        </div>
        <div id="toast" class="toast"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
