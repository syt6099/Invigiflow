<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Database</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="app">
        <a href="database.html" class="back-link">← Database</a>
        <div class="card mt-3">
            <h2>Upload Teacher Database</h2>
            <div class="form-group mt-3">
                <label>CSV File</label>
                <input type="file" id="db-csv" accept=".csv">
                <div class="mt-2">
                    <button class="btn btn-outline btn-sm" id="db-template-btn">
                        <i class="fas fa-download"></i> Download Template
                    </button>
                </div>
            </div>
            <button class="btn btn-primary" id="db-parse-btn">Upload & Parse</button>

            <hr class="mt-4 mb-4" style="border-color:var(--border);">

            <h3>Manual Entry</h3>
            <div class="form-row mt-2">
                <div class="form-group"><label>Name</label><input type="text" id="db-manual-name" placeholder="Jane Doe"></div>
                <div class="form-group"><label>Email</label><input type="email" id="db-manual-email" placeholder="jane@school.edu"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Subjects (comma-separated)</label><input type="text" id="db-manual-subjects" placeholder="Math, Physics"></div>
                <div class="form-group"><label>Years at School</label><input type="number" id="db-manual-years" placeholder="2"></div>
            </div>
            <div class="form-group"><label>Teaching Hours/Week</label><input type="number" id="db-manual-hours" placeholder="18"></div>
            <button class="btn btn-primary btn-sm" id="db-add-manual-btn">Add Teacher</button>

            <div class="mt-4">
                <h4>Preview</h4>
                <div id="db-upload-preview" class="table-wrap">
                    <p class="text-muted text-sm">No teachers added yet.</p>
                </div>
            </div>

            <div class="flex gap-2 mt-4">
                <button class="btn btn-success" id="db-save-btn">Save to Database</button>
                <a href="database.html" class="btn btn-outline">Cancel</a>
            </div>
        </div>
        <div id="toast" class="toast"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
