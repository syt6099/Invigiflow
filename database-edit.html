<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Database</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <a href="database.html" class="back-link">← Database</a>
        <div class="card mt-3">
            <h2>Edit Teacher Records</h2>

            <!-- Manual Add Section -->
            <div style="border:1px solid var(--border); padding:16px; border-radius:8px; margin-bottom:20px;">
                <h3>Add New Teacher</h3>
                <div class="form-row mt-2">
                    <div class="form-group"><label>Name</label><input type="text" id="db-edit-name" placeholder="Jane Doe"></div>
                    <div class="form-group"><label>Email</label><input type="email" id="db-edit-email" placeholder="jane@school.edu"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Subjects (comma-separated)</label><input type="text" id="db-edit-subjects" placeholder="Math, Physics"></div>
                    <div class="form-group"><label>Years at School</label><input type="number" id="db-edit-years" placeholder="2"></div>
                </div>
                <div class="form-group"><label>Teaching Hours/Week</label><input type="number" id="db-edit-hours" placeholder="18"></div>
                <button class="btn btn-primary btn-sm" id="db-edit-add-btn">Add Teacher</button>
            </div>

            <div id="db-edit-container" class="mt-3">
                <p class="text-muted">Loading teachers...</p>
            </div>
            <div class="flex gap-2 mt-4">
                <button class="btn btn-success" id="db-edit-save-btn">Save Changes</button>
                <a href="database.html" class="btn btn-outline">Cancel</a>
            </div>
        </div>
        <div id="toast" class="toast"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
