<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Availability</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <a href="settings.html" class="back-link">← Settings</a>
        <div class="card mt-3">
            <div class="card-header">
                <h2>Teacher Availability</h2>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Select Teacher</label>
                    <select id="avail-teacher-select">
                        <option value="">Select teacher</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Unavailable from</label>
                    <input type="datetime-local" id="avail-start">
                </div>
                <div class="form-group">
                    <label>Unavailable to</label>
                    <input type="datetime-local" id="avail-end">
                </div>
            </div>
            <div class="flex gap-2">
                <button class="btn btn-primary btn-sm" id="add-avail-btn">Add Slot</button>
            </div>

            <div class="mt-4">
                <h3>Current Availability</h3>
                <div id="avail-list" class="scroll-y" style="max-height:200px;">
                    <p class="text-muted text-sm">No constraints added yet.</p>
                </div>
            </div>

            <div class="flex gap-2 mt-4">
                <button class="btn btn-primary" id="confirm-avail-btn">Confirm & Next</button>
                <a href="settings.html" class="btn btn-outline">Back</a>
            </div>
        </div>
        <div id="toast" class="toast"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
