<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="login-box">
            <h1>Reset Password</h1>
            <p class="sub">Enter your email to reset your password</p>
            <form id="forgot-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="forgot-email" required>
                </div>
                <div class="form-group">
                    <label>Verification Code</label>
                    <div style="display:flex; gap:8px;">
                        <input type="text" id="forgot-code" placeholder="6-digit code" required style="flex:1;">
                        <button type="button" id="forgot-send-code-btn" class="btn btn-outline btn-sm">Send Code</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="forgot-new-password" required>
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="forgot-confirm" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
                <div class="links" style="justify-content:center; margin-top:12px;">
                    <a href="login.html">Back to login</a>
                </div>
            </form>
        </div>
        <div id="toast" class="toast"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
