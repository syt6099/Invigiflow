<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Upload</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="app">
        <a href="availability.html" class="back-link">← Availability</a>
        <div class="card mt-3">
            <div class="card-header">
                <h2>Exam Sessions</h2>
            </div>

            <div class="tab-bar">
                <button data-tab="csv" class="active">CSV Upload</button>
                <button data-tab="manual">Manual Entry</button>
            </div>

            <!-- CSV -->
            <div id="upload-csv">
                <div class="form-group">
                    <label>Upload CSV file</label>
                    <input type="file" id="csv-file" accept=".csv">
                    <div class="mt-2">
                        <button class="btn btn-outline btn-sm" id="download-template-btn">
                            <i class="fas fa-download"></i> Download Template CSV
                        </button>
                    </div>
                </div>
                <button class="btn btn-primary" id="parse-csv-btn">Parse CSV</button>
            </div>

            <!-- Manual -->
            <div id="upload-manual" class="hidden">
                <div class="form-row">
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" id="manual-subject" list="subject-list" placeholder="e.g. Mathematics" required>
                        <datalist id="subject-list"></datalist>
                    </div>
                    <div class="form-group">
                        <label>Exam Name</label>
                        <input type="text" id="manual-name" placeholder="e.g. Math Final">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Type</label>
                        <select id="manual-type">
                            <option value="internal">Internal</option>
                            <option value="external">External</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label># Students</label>
                        <input type="number" id="manual-students" placeholder="30" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Start Time</label>
                        <input type="datetime-local" id="manual-start" required>
                    </div>
                    <div class="form-group">
                        <label>End Time</label>
                        <input type="datetime-local" id="manual-end" required>
                    </div>
                </div>
                <button class="btn btn-primary btn-sm" id="add-manual-btn">Add Exam</button>
                <div class="mt-3" id="manual-exam-list">
                    <p class="text-muted text-sm">No exams added yet.</p>
                </div>
            </div>

            <div class="mt-4 flex gap-2">
                <button class="btn btn-success" id="confirm-upload-btn">Confirm Exam List</button>
                <a href="availability.html" class="btn btn-outline">Back</a>
            </div>
        </div>
        <div id="toast" class="toast"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
